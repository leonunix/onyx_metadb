[package]
name = "onyx-metadb"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Embedded metadata engine for Onyx Storage: sharded COW B+tree + fixed-record LSM + shared WAL"
license = "Apache-2.0"
repository = "https://github.com/leonunix/onyx_metadb"
readme = "README.md"

[lib]
name = "onyx_metadb"
path = "src/lib.rs"

[dependencies]
# Core runtime
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
# Persistent worker pool for the checkpoint fan-outs. Both of them used
# `std::thread::scope`, i.e. 16 fresh threads per checkpoint cycle, and each
# exiting thread ran jemalloc's `tsd_cleanup` -> `arena_decay` ->
# `pac_decay_all`, purging every dirty extent it had touched: ~954
# `madvise(MADV_DONTNEED)` per exit, 3,815/s, each broadcasting a TLB-shootdown
# IPI to all ~39 CPUs sharing the mm. rayon is used for its SCOPED pool: the
# fan-out closures borrow `&self`, so a plain 'static worker pool cannot take
# them without either an unsafe lifetime erasure of our own or Arc-ifying the
# drain data structures. Already a direct dependency of onyx-storage and
# onyx-chunklet, so this adds nothing to the build graph.
rayon = "1.10"
dashmap = "6"
lru = "0.12"

# IO / OS
nix = { version = "0.29", features = ["fs", "mman"] }
libc = "0.2"

# Hashing / checksums
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Serialization (metadata only; on-disk formats are hand-rolled)
bytemuck = { version = "1.14", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"

# Errors / tracing
thiserror = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Enable fault-injection hooks for crash / IO tests (build without in release).
fault-injection = []
# Enable expensive invariant checks after every mutation.
paranoid = []

[profile.release]
lto = "thin"
codegen-units = 1
debug = true

[profile.bench]
inherits = "release"
